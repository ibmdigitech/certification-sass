version: '3.8'

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: certuser
      POSTGRES_PASSWORD: certpass
      POSTGRES_DB: certapp
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://certuser:certpass@db:5432/certapp?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme
      APP_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      - db
    volumes:
      - ./:/app

volumes:
  db_data:
