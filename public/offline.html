<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - CertAI</title>
  <meta name="description" content="CertAI - You're currently offline">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full text-center">
    <div class="mx-auto mb-6 w-24 h-24 rounded-2xl bg-slate-800/50 flex items-center justify-center border border-slate-700">
      <svg class="w-12 h-12 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 006 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m-1.5 0h1.5m-18 0a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121.75 3v2.25m-18 0l6.75 6.75m0 0l3.5 3.5m-3.5-3.5L9 18.75m10.5-8.25L12 12.75m0 0l-3.5 3.5m3.5-3.5l6.75 6.75" />
      </svg>
    </div>

    <h1 class="text-3xl font-bold mb-2">You're Offline</h1>
    <p class="text-slate-400 mb-8">
      Don't worry! CertAI works offline. Your changes will sync automatically when you're back online.
    </p>

    <div class="bg-slate-800/50 rounded-xl p-6 border border-slate-700 mb-8">
      <div class="flex items-center justify-center gap-3 mb-4">
        <div class="w-3 h-3 rounded-full bg-slate-500 animate-pulse-slow" id="online-indicator"></div>
        <span class="text-slate-300" id="status-text">Checking connection...</span>
      </div>
      <p class="text-sm text-slate-500">
        Cached data is available for viewing. Mutations are queued for sync.
      </p>
    </div>

    <div class="space-y-3">
      <button
        onclick="window.location.reload()"
        class="w-full py-3 px-6 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors"
      >
        Try Reconnecting
      </button>
      <button
        onclick="navigateToCached()"
        class="w-full py-3 px-6 bg-slate-800 hover:bg-slate-700 text-white font-medium rounded-lg transition-colors border border-slate-700"
      >
        View Cached Data
      </button>
    </div>

    <div class="mt-8 text-xs text-slate-500">
      <p>CertAI v1.0.0 &middot; Offline-First Architecture</p>
    </div>
  </div>

  <script>
    const indicator = document.getElementById('online-indicator');
    const statusText = document.getElementById('status-text');

    function updateOnlineStatus() {
      if (navigator.onLine) {
        indicator.className = 'w-3 h-3 rounded-full bg-emerald-500';
        statusText.textContent = 'Online - Syncing...';
        statusText.className = 'text-emerald-400';
        setTimeout(() => window.location.reload(), 1000);
      } else {
        indicator.className = 'w-3 h-3 rounded-full bg-slate-500 animate-pulse-slow';
        statusText.textContent = 'Offline - Waiting for connection...';
        statusText.className = 'text-slate-300';
      }
    }

    function navigateToCached() {
      if ('caches' in window) {
        caches.keys().then(names => {
          if (names.length > 0) {
            window.location.href = '/dashboard';
          } else {
            alert('No cached data available');
          }
        });
      } else {
        window.location.href = '/dashboard';
      }
    }

    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'SYNC_COMPLETE') {
          statusText.textContent = 'Synced successfully! Reloading...';
          statusText.className = 'text-emerald-400';
          setTimeout(() => window.location.reload(), 1500);
        }
      });
    }
  </script>
</body>
</html>
