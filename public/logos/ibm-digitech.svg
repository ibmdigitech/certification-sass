<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93c5fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="url(#bgGrad)"/>
  <!-- Accent line -->
  <rect x="16" y="10" width="4" height="40" rx="2" fill="#fbbf24"/>
  <!-- Company Name -->
  <text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="url(#textGrad)">IBM Digitech</text>
  <!-- Tagline -->
  <text x="30" y="52" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#dbeafe">Technical Services</text>
</svg>