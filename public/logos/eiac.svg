<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="eiacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Circle background -->
  <circle cx="60" cy="60" r="56" fill="url(#eiacGrad)"/>
  <!-- EIAC Text -->
  <text x="60" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">EIAC</text>
  <!-- Accreditation text -->
  <text x="60" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#dbeafe">Emirates International</text>
  <text x="60" cy="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#dbeafe">Accreditation Centre</text>
  <!-- Gold accent ring -->
  <circle cx="60" cy="60" r="54" stroke="#fbbf24" stroke-width="2" fill="none"/>
</svg>