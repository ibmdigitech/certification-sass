<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120">
  <defs>
    <linearGradient id="eiacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="enasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- EIAC Logo (left) -->
  <g transform="translate(0, 0)">
    <circle cx="60" cy="60" r="56" fill="url(#eiacGrad)"/>
    <text x="60" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">EIAC</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#dbeafe">Emirates International</text>
    <text x="60" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#dbeafe">Accreditation Centre</text>
    <circle cx="60" cy="60" r="54" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>
  <!-- ENAS Logo (right) -->
  <g transform="translate(120, 0)">
    <circle cx="60" cy="60" r="56" fill="url(#enasGrad)"/>
    <text x="60" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">ENAS</text>
    <text x="60" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#fecaca">Emirates National</text>
    <text x="60" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#fecaca">Accreditation System</text>
    <circle cx="60" cy="60" r="54" stroke="#fbbf24" stroke-width="2" fill="none"/>
  </g>
  <!-- Divider -->
  <line x1="120" y1="15" x2="120" y2="105" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,4"/>
</svg>